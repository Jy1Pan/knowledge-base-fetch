name: fetch

# 两班。每天 UTC 20:30 那一班抓 daily 与 monthly 源；每周源另由 UTC 周一 08:17 那一班抓。
# 知识库的定时任务在 UTC 00:30 读（2026-10-24 起），所以日班有约四小时余量。
# 2026-10-16 从 21:30 提前到 20:30：GitHub 的计划任务在高峰时段会被推迟，三十分钟余量不够。
# 2026-11-04 起：每周源单独一班、提前十二小时。11-02 那一班日班被推迟 6 小时 02 分、跨过 UTC 零点，
# 按次日（周二）判 cadence，把十个周一才抓的每周源整批跳过。fetch.py 现在按 cron 的计划日判 cadence
# （设计依据第 7 条），这一条治「跨了零点」；单独一班治「延迟太大」，两条一起做。
# 两个 cron 字符串在下面 env 里各出现一次，改 cron 时三处一起改。
on:
  schedule:
    - cron: "30 20 * * *"
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      run_set:
        description: "抓哪一班：daily（daily 与 monthly）、weekly、all（三种都看）"
        required: false
        default: "all"
      plan_date:
        description: "按哪一天判 cadence（YYYY-MM-DD，留空则按此刻的 UTC 日期）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KB_RUN_SET: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 8 * * 1' && 'weekly' || 'daily') || inputs.run_set || 'all' }}
      KB_CRON_UTC: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 8 * * 1' && '08:17' || '20:30') || '' }}
      KB_PLAN_DATE: ${{ inputs.plan_date || '' }}
      KB_RUN_FILE: /tmp/kb_run.json   # 不进仓库；runner 上下文在 job 级 env 里不可用，所以写死 /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # 2026-10-16 起：工作流里没有任何一步读 git 历史，浅克隆就够

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch all due sources
        run: python fetch.py

      # 三方分工里 API 那一环。只对今天变了的源调模型，没变的与第一次抓到的零花费。
      # 密钥只从仓库 Secrets 读，不进任何文件。没设密钥时它记一行 skipped_no_key 然后正常结束。
      # continue-on-error：digest 出任何意外都不能挡住下一步把 fetch 的结果提交上去，
      # 与 fetch.py「一个源失败不让整次运行失败」是同一条原则。
      - name: digest changed sources with the API
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KB_MODEL: ${{ vars.KB_MODEL }}
          KB_MAX_CALLS: ${{ vars.KB_MAX_CALLS || '25' }}
        run: python digest.py

      - name: commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "kb-fetcher"
          git config user.email "kb-fetcher@users.noreply.github.com"
          git add -A latest history manifest.jsonl
          if [ -d digest ]; then git add -A digest; fi
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          # 提交标题里带当天的成功/失败计数，这样下游不读内容也能看出这次跑成了没有。
          # 第二版起按 content_ok 计（状态 200 且过了内容闸门），见 fetch.py 设计依据第 6 条。
          # 2026-11-04 起 ok 数与日期都取自 fetch.py 写的本班记录（KB_RUN_FILE）：
          # 日期是计划日不是墙上日期，计数只算本班抓的源。标题前缀 daily 班仍是「fetch」，weekly 班是「fetch-weekly」。
          read -r PLAN OK PREFIX LATEST < <(python - <<'PY'
          import json,os
          r=json.load(open(os.environ['KB_RUN_FILE'],encoding='utf-8'))
          w=r['run_set']=='weekly'
          print(r['plan_date'], f"{r['ok']}/{r['total']}", 'fetch-weekly' if w else 'fetch', 'digest/latest-weekly.json' if w else 'digest/latest.json')
          PY
          )
          DG=$(LATEST="$LATEST" python -c "import json,os;d=json.load(open(os.environ['LATEST']));print(f\"{d['candidates_verified']}/{d['candidates']} {d['run']['status']}\")" 2>/dev/null || echo "n/a")
          git commit -m "${PREFIX} ${PLAN}: ok ${OK}; digest ${DG}"
          git push
