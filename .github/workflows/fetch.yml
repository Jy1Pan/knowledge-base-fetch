name: fetch

# 每天 UTC 20:30 跑一次。刻意排在知识库定时任务（UTC 22:00）之前九十分钟，
# 这样知识库每次读到的都是当天刚抓的那一版，而不是前一天的。
# 这个相位差是故意的，知识库那边记了三次「相位差」的坑，这里一次解掉。
# 2026-10-16 从 21:30 提前到 20:30：GitHub 的计划任务在高峰时段会被推迟，三十分钟余量不够。
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # 2026-10-16 起：工作流里没有任何一步读 git 历史，浅克隆就够

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch all due sources
        run: python fetch.py

      # 三方分工里 API 那一环。只对今天变了的源调模型，没变的与第一次抓到的零花费。
      # 密钥只从仓库 Secrets 读，不进任何文件。没设密钥时它记一行 skipped_no_key 然后正常结束。
      # continue-on-error：digest 出任何意外都不能挡住下一步把 fetch 的结果提交上去，
      # 与 fetch.py「一个源失败不让整次运行失败」是同一条原则。
      - name: digest changed sources with the API
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KB_MODEL: ${{ vars.KB_MODEL }}
          KB_MAX_CALLS: ${{ vars.KB_MAX_CALLS || '25' }}
        run: python digest.py

      - name: commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "kb-fetcher"
          git config user.email "kb-fetcher@users.noreply.github.com"
          git add -A latest history manifest.jsonl
          if [ -d digest ]; then git add -A digest; fi
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          # 提交标题里带当天的成功/失败计数，这样下游不读内容也能看出这次跑成了没有。
          # 第二版起按 content_ok 计（状态 200 且过了内容闸门），见 fetch.py 设计依据第 6 条。
          OK=$(python - <<'PY'
          import json,pathlib,datetime
          d=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')
          p=pathlib.Path('manifest.jsonl')
          rows=[json.loads(l) for l in p.read_text(encoding='utf-8').splitlines() if l.strip()]
          rows=[r for r in rows if r['fetched_at_utc'].startswith(d)]
          # 2026-10-16 修：同一天手动跑多次时只算每个源当天最后一行，否则分母是当天全部运行的行数之和（曾出现 ok 11/48，实为 11/16）
          rows=list({r['slug']: r for r in rows}.values())
          print(f"{sum(1 for r in rows if r.get('content_ok'))}/{len(rows)}")
          PY
          )
          DG=$(python -c "import json;d=json.load(open('digest/latest.json'));print(f\"{d['candidates_verified']}/{d['candidates']} {d['run']['status']}\")" 2>/dev/null || echo "n/a")
          git commit -m "fetch $(date -u +%F): ok ${OK}; digest ${DG}"
          git push
